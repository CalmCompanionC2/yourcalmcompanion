<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CalmCompanion™ — Coming Soon</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/CalmCompanionC2/yourcalmcompanion/refs/heads/main/favicon.png">
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/CalmCompanionC2/yourcalmcompanion/refs/heads/main/favcon180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f7f2ea;
    --warm-white: #faf7f2;
    --gold: #C8920E;
    --gold-light: #E8A84A;
    --brown-dark: #2A1A08;
    --brown-mid: #6B4A2A;
    --brown-light: #C8A87A;
    --text: #1A1208;
    --text-muted: #8B7355;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--cream);
    color: var(--text);
    font-family: 'Jost', sans-serif;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 100;
    opacity: 0.4;
  }

  .page {
    min-height: 100vh;
    display: grid;
    grid-template-rows: 1fr auto;
    position: relative;
  }

  .bg-glow {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 20%, rgba(200,146,14,0.08) 0%, transparent 70%),
      radial-gradient(ellipse 60% 80% at 80% 80%, rgba(122,140,106,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 40% 40% at 20% 60%, rgba(200,168,122,0.05) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  main {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 24px;
    min-height: 100vh;
  }

  .eyebrow-line {
    width: 1px;
    height: 60px;
    background: linear-gradient(to bottom, transparent, var(--brown-light));
    margin-bottom: 24px;
    animation: fadeDown 1.2s ease forwards;
    opacity: 0;
  }

  .logo-mark {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 36px;
    animation: fadeUp 1s ease 0.3s forwards;
    opacity: 0;
  }

  .cc-monogram {
    width: 56px;
    height: 56px;
    border: 1.5px solid var(--brown-light);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .cc-monogram::before {
    content: '';
    position: absolute;
    inset: 4px;
    border: 1px solid var(--brown-light);
    border-radius: 50%;
    opacity: 0.4;
  }

  .cc-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    font-weight: 300;
    color: var(--gold);
    letter-spacing: 2px;
  }

  .norman-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 28px;
    animation: fadeUp 1s ease 0.45s forwards;
    opacity: 0;
  }

  .norman-img {
    width: 280px;
    height: auto;
    display: block;
    animation: float 5s ease-in-out infinite;
    animation-delay: 2s;
  }

  .meet-norman {
    font-family: 'Jost', sans-serif;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-top: 14px;
  }

  .headline {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(42px, 8vw, 88px);
    font-weight: 300;
    line-height: 1.05;
    text-align: center;
    color: var(--brown-dark);
    margin-bottom: 10px;
    animation: fadeUp 1s ease 0.6s forwards;
    opacity: 0;
    letter-spacing: -1px;
  }

  .headline em {
    font-style: italic;
    color: var(--gold);
  }

  .tagline {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(15px, 2.5vw, 22px);
    font-weight: 300;
    font-style: italic;
    text-align: center;
    color: var(--text-muted);
    margin-bottom: 28px;
    animation: fadeUp 1s ease 0.7s forwards;
    opacity: 0;
    letter-spacing: 0.5px;
  }

  .coming-soon {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(24px, 4vw, 42px);
    font-weight: 300;
    font-style: italic;
    text-align: center;
    color: var(--brown-mid);
    margin-bottom: 32px;
    animation: fadeUp 1s ease 0.75s forwards;
    opacity: 0;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 32px;
    animation: fadeUp 1s ease 0.8s forwards;
    opacity: 0;
  }

  .divider-line {
    width: 80px;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--brown-light));
  }

  .divider-line.right {
    background: linear-gradient(to left, transparent, var(--brown-light));
  }

  .divider-diamond {
    width: 6px;
    height: 6px;
    background: var(--gold);
    transform: rotate(45deg);
  }

  .description {
    font-family: 'Jost', sans-serif;
    font-size: clamp(14px, 2vw, 17px);
    font-weight: 300;
    line-height: 1.8;
    text-align: center;
    color: var(--brown-mid);
    max-width: 480px;
    margin-bottom: 44px;
    animation: fadeUp 1s ease 0.9s forwards;
    opacity: 0;
    letter-spacing: 0.2px;
  }

  .email-form {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: 100%;
    max-width: 420px;
    margin-bottom: 52px;
    animation: fadeUp 1s ease 1s forwards;
    opacity: 0;
  }

  .form-label {
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .form-note {
    font-size: 14px;
    font-weight: 300;
    color: var(--brown-light);
    letter-spacing: 0.3px;
  }

  .pillars {
    display: flex;
    gap: 48px;
    margin-bottom: 52px;
    animation: fadeUp 1s ease 1.1s forwards;
    opacity: 0;
    flex-wrap: wrap;
    justify-content: center;
  }

  .pillar {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    text-align: center;
    max-width: 140px;
  }

  .pillar-icon {
    width: 40px;
    height: 40px;
    border: 1px solid var(--brown-light);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    opacity: 0.8;
  }

  .pillar-title {
    font-family: 'Jost', sans-serif;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .pillar-desc {
    font-family: 'Cormorant Garamond', serif;
    font-size: 14px;
    font-weight: 300;
    font-style: italic;
    color: var(--brown-mid);
    line-height: 1.5;
  }

  .bottom-tagline {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(13px, 2vw, 16px);
    font-weight: 300;
    font-style: italic;
    color: var(--brown-light);
    text-align: center;
    letter-spacing: 1px;
    animation: fadeUp 1s ease 1.2s forwards;
    opacity: 0;
  }

  footer {
    position: relative;
    z-index: 1;
    padding: 24px;
    text-align: center;
    border-top: 1px solid rgba(200,168,122,0.2);
  }

  .footer-text {
    font-size: 10px;
    font-weight: 300;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--brown-light);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  @media (max-width: 600px) {
    .pillars { gap: 28px; }
    .norman-img { width: 220px; }
  }

  .ml-embedded { width: 100%; max-width: 420px; }
  .ml-embedded .ml-form-embedWrapper { background: transparent !important; border: none !important; padding: 0 !important; }
  .ml-embedded input[type="email"] { font-family: 'Jost', sans-serif !important; font-size: 13px !important; border: 1px solid var(--brown-light) !important; background: var(--warm-white) !important; }
  .ml-embedded button[type="submit"] { background: var(--gold) !important; font-family: 'Jost', sans-serif !important; letter-spacing: 3px !important; text-transform: uppercase !important; }
  .ml-embedded button[type="submit"]:hover { background: var(--gold-light) !important; }
</style>

</head>

<div class="page">
  <main>

    <div class="eyebrow-line"></div>

    <div class="logo-mark">
      <div class="cc-monogram">
        <span class="cc-text">CC</span>
      </div>
